[project]
name = "zyntry-code"
version = "0.1.0"
description = "Zyntry Code - Adaptive AI Engineering Agent backend (FastAPI on Cloudflare Workers)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.0",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# src/ holds the backend (flat modules + domain/providers/routers packages);
# execworker/ is the standalone remote worker package.
[tool.setuptools]
package-dir = { "" = "src", "execworker" = "execworker" }
packages = ["execworker", "domain", "providers", "routers"]
py-modules = [
    "agent", "app", "db", "executor", "metrics", "planner", "reporter",
    "runtime", "schemas", "security", "store", "tools_service", "util", "worker",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "uvicorn>=0.30",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]